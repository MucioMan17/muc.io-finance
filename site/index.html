<style>
  :root{
    --bg:#0B0E13; --panel:#121a28; --panel-2:#17212f;
    --ink:#F6F4EE; --muted:#9aa4b2; --faint:#636b78;
    --gold:#F2B84B; --gold-2:#FAD489;
    --line:rgba(242,184,75,.17); --line-2:rgba(242,184,75,.46);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; overflow-x:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(78% 48% at 50% -6%, rgba(242,184,75,.13), transparent 60%);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    min-height:100svh; display:flex; align-items:flex-start; justify-content:center;
    padding:clamp(30px,7vw,64px) clamp(20px,5vw,40px);
  }
  .hub{width:100%; max-width:450px; text-align:center;}
  .coin{width:104px; height:104px; margin:0 auto 20px; display:block;
    filter:drop-shadow(0 8px 26px rgba(242,184,75,.28));}
  .eyebrow{font-size:.72rem; letter-spacing:.28em; text-transform:uppercase;
    color:var(--gold); font-weight:700; margin:0 0 11px;}
  h1{font-size:clamp(2rem,7vw,2.6rem); line-height:1.04; margin:0 0 13px;
    font-weight:800; letter-spacing:-.01em; text-wrap:balance; overflow-wrap:break-word; max-width:100%;}
  .tag{font-size:1rem; line-height:1.5; color:var(--muted); max-width:33ch;
    margin:0 auto 30px; text-wrap:balance;}
  .links{display:flex; flex-direction:column; gap:13px;}
  .link{display:flex; align-items:center; gap:15px; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:15px;
    padding:15px 18px; text-decoration:none; color:var(--ink);
    transition:transform .15s ease, border-color .2s ease, background .2s ease, box-shadow .22s ease;}
  .link:hover{transform:translateY(-2px); border-color:var(--line-2); background:var(--panel-2);
    box-shadow:0 12px 28px rgba(0,0,0,.4);}
  .link:focus-visible{outline:3px solid var(--gold-2); outline-offset:3px;}
  .ic{flex:0 0 auto; width:28px; height:28px; display:grid; place-items:center; color:var(--gold);}
  .lbl{flex:1 1 auto; font-weight:600; font-size:1.06rem; line-height:1.2;}
  .sub{display:block; font-weight:400; font-size:.82rem; color:var(--muted); margin-top:3px;}
  .chev{flex:0 0 auto; color:var(--faint); font-size:1.3rem; line-height:1;}
  .foot{margin:32px 0 0; font-size:.75rem; color:var(--faint); letter-spacing:.01em;}
  @media (prefers-reduced-motion:no-preference){
    .hub{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;}
    @keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  }
</style>
